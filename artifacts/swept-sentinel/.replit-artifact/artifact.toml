kind = "web"
previewPath = "/"
title = "Swept Sentinel"
version = "1.0.0"
id = "artifacts/swept-sentinel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21812

[services.development]
run = "pnpm --filter @workspace/swept-sentinel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swept-sentinel", "run", "build" ]
publicDir = "artifacts/swept-sentinel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21812"
BASE_PATH = "/"

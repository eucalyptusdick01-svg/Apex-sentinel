kind = "video"
previewPath = "/swept-sentinel-video/"
title = "Swept Sentinel — Platform Explainer"
description = "A 38-second animated motion graphics video showing Swept Sentinel's OSINT intelligence platform — 230 modules, live terminal output, category breakdown, and the platform tagline. Used on the landing and modules pages to demonstrate the product before registration."
version = "1.0.0"
id = "artifacts/swept-sentinel-video"
router = "path"

[[services]]
name = "web"
paths = [ "/swept-sentinel-video/" ]
localPort = 25496

[services.development]
run = "pnpm --filter @workspace/swept-sentinel-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swept-sentinel-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/swept-sentinel-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25496"
BASE_PATH = "/swept-sentinel-video/"

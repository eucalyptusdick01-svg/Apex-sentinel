openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sentinel
    description: Swept Sentinel OSINT module operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sentinel/modules:
    get:
      operationId: listModules
      tags: [sentinel]
      summary: List all 230 OSINT modules
      responses:
        "200":
          description: Module list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
  /sentinel/execute:
    post:
      operationId: executeModule
      tags: [sentinel]
      summary: Execute a single OSINT module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sentinel/batch:
    post:
      operationId: executeBatch
      tags: [sentinel]
      summary: Execute multiple modules sequentially against one target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "200":
          description: Batch execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sentinel/stream/{runId}:
    get:
      operationId: streamOutput
      tags: [sentinel]
      summary: Stream module output via SSE
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sentinel/history:
    get:
      operationId: listHistory
      tags: [sentinel]
      summary: List all past runs
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunHistoryItem"
  /sentinel/history/{id}:
    get:
      operationId: getHistoryRun
      tags: [sentinel]
      summary: Get a single past run with full output
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunHistoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteHistoryRun
      tags: [sentinel]
      summary: Delete a single run from history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Module:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
      required: [id, name, category]
    ModuleInput:
      type: object
      properties:
        moduleId:
          type: integer
        target:
          type: string
      required: [moduleId, target]
    ExecuteResult:
      type: object
      properties:
        runId:
          type: string
        moduleId:
          type: integer
        target:
          type: string
        streamUrl:
          type: string
        historyId:
          type: integer
      required: [runId, moduleId, target, streamUrl, historyId]
    BatchInput:
      type: object
      properties:
        moduleIds:
          type: array
          items:
            type: integer
        target:
          type: string
      required: [moduleIds, target]
    BatchResult:
      type: object
      properties:
        batchId:
          type: string
        runId:
          type: string
        moduleIds:
          type: array
          items:
            type: integer
        target:
          type: string
        streamUrl:
          type: string
      required: [batchId, runId, moduleIds, target, streamUrl]
    RunHistoryItem:
      type: object
      properties:
        id:
          type: integer
        moduleId:
          type: integer
        moduleName:
          type: string
        target:
          type: string
        output:
          type: string
        batchId:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, moduleId, moduleName, target, output, batchId, createdAt]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

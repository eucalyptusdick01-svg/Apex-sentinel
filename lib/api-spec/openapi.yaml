openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sentinel
    description: Swept Sentinel OSINT module operations
  - name: auth
    description: Authentication operations
  - name: admin
    description: Admin panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sentinel/execute:
    post:
      operationId: executeModule
      tags: [sentinel]
      summary: Execute an OSINT module
      description: Spawns swept_sentinel.py with the given module number and target, returns the run ID for SSE streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sentinel/stream/{runId}:
    get:
      operationId: streamOutput
      tags: [sentinel]
      summary: Stream module output via SSE
      description: Server-sent events stream for a running module's stdout
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream of module output lines
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sentinel/modules:
    get:
      operationId: listModules
      tags: [sentinel]
      summary: List all 230 OSINT modules
      responses:
        "200":
          description: Module list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users with run counts
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{userId}/runs:
    get:
      operationId: adminGetUserRuns
      tags: [admin]
      summary: Get runs for a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/runs/{runId}:
    get:
      operationId: adminGetRun
      tags: [admin]
      summary: Get a specific run with full output
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Module:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
      required:
        - id
        - name
        - category
    ModuleInput:
      type: object
      properties:
        moduleId:
          type: integer
        target:
          type: string
      required:
        - moduleId
        - target
    ExecuteResult:
      type: object
      properties:
        runId:
          type: string
        moduleId:
          type: integer
        target:
          type: string
        streamUrl:
          type: string
      required:
        - runId
        - moduleId
        - target
        - streamUrl
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
      required:
        - id
        - email
        - isAdmin
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
        runCount:
          type: integer
      required:
        - id
        - email
        - isAdmin
        - createdAt
        - runCount
    RunRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        target:
          type: string
        moduleId:
          type: integer
        moduleName:
          type: string
        output:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
          nullable: true
      required:
        - id
        - userId
        - target
        - moduleId
        - moduleName
        - output
        - startedAt
